# 网站基本信息
title: 跨境电商平台对比目录
description: 帮助卖家选择最适合的跨境电商平台 - 入驻条件、手续费、流量规模、运营难度全对比。覆盖TikTok Shop、Temu、亚马逊、Shopee等10大平台，提供详细对比和选品指南。
author: martinhost
lang: zh-CN
locale: zh_CN

# Jekyll主题
theme: jekyll-theme-cayman

# 网站设置
baseurl: "/crossborder-platforms"
url: "https://martinhost.github.io"

# Markdown设置
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 导航菜单
header_pages:
  - index.md
  - platforms.md
  - compare.md
  - guide.md

# SEO设置
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO元数据
twitter:
  username: martinhost
  card: summary_large_image

social:
  name: martinhost
  links:
    - https://github.com/martinhost

# 默认SEO标签
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

# 排除文件
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# 包含文件
include:
  - robots.txt
